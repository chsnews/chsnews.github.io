media:
  input: .
  output: .

content:
  - label: News Articles
    type: file
    path: articles.json
    format: json
    fields:
      - label: School News Feed
        name: articles
        type: list
        fields:
          - label: Article Title
            name: title
            type: string
          - label: Category Tag
            name: category
            type: select
            options: [School State, Bell Times, Tech Tip]
          - label: Post Date
            name: date
            type: string
          - label: Main Content
            name: body
            type: text
